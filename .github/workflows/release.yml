name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          if (-not ($candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })) {
            winget install --id JRSoftware.InnoSetup -e --version 6.7.3 --source winget --scope machine --silent --accept-package-agreements --accept-source-agreements
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed with exit code $LASTEXITCODE" }
          }

      - name: Build patch-only installer
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') { throw "Expected a version tag like v1.0.3; got $tag" }
          $version = $Matches.version
          $payload = "release-assets\MewnBaseMP-patch-v$version.zip"
          if (-not (Test-Path -LiteralPath $payload -PathType Leaf)) { throw "Versioned binary patch payload is missing: $payload" }
          $output = "dist\release-$version"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) { throw "Pinned Inno Setup compiler was not found: $iscc" }
          & .\tools\installer\Build-Installer.ps1 -PayloadZip $payload -PatchVersion $version -OutputDir $output -ISCCPath $iscc
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed with exit code $LASTEXITCODE" }
          $installer = Get-ChildItem -LiteralPath $output -Filter 'MewnBaseMP-Setup-*.exe' -File | Select-Object -First 1
          if ($null -eq $installer) { throw 'The installer executable was not created.' }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath ($installer.FullName + '.sha256') -Encoding ascii
          Write-Host "Release asset: $($installer.FullName)"
          Write-Host "SHA-256: $hash"

      - name: Build manual class patch archives
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') { throw "Expected a version tag like v1.0.4; got $tag" }
          $version = $Matches.version
          $payload101 = "release-assets\MewnBaseMP-patch-v$version-1.0.1.zip"
          $payload102 = "release-assets\MewnBaseMP-patch-v$version-1.0.2.zip"
          if ((Test-Path -LiteralPath $payload101 -PathType Leaf) -and (Test-Path -LiteralPath $payload102 -PathType Leaf)) {
            foreach ($gameVersion in @('1.0.1', '1.0.2')) {
              $payload = "release-assets\MewnBaseMP-patch-v$version-$gameVersion.zip"
              $output = "dist\release-$version\MewnBaseMP-Manual-Install-v$version-MewnBase-$gameVersion.zip"
              & .\tools\installer\Build-ManualPatchZip.ps1 -PayloadZip $payload -PatchVersion $version -OutputZip $output
              if ($LASTEXITCODE -ne 0) { throw "Manual archive build failed for MewnBase $gameVersion." }
            }
          } else {
            $payload = "release-assets\MewnBaseMP-patch-v$version.zip"
            $output = "dist\release-$version\MewnBaseMP-Manual-Install-v$version.zip"
            & .\tools\installer\Build-ManualPatchZip.ps1 -PayloadZip $payload -PatchVersion $version -OutputZip $output
            if ($LASTEXITCODE -ne 0) { throw 'Manual archive build failed.' }
          }

      - name: Prepare bilingual release notes
        id: release_notes
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') { throw "Expected a version tag like v1.0.4; got $tag" }
          $notesPath = "docs\releases\v$($Matches.version).md"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) { throw "Bilingual release notes are missing: $notesPath" }
          $notes = [IO.File]::ReadAllText((Resolve-Path -LiteralPath $notesPath).Path)
          $delimiter = 'RELEASE_NOTES_' + [guid]::NewGuid().ToString('N')
          $output = "body<<$delimiter`n$notes`n$delimiter`n"
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, $output, [Text.UTF8Encoding]::new($false))

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release-*/*.exe
            dist/release-*/*.zip
            dist/release-*/*.sha256
          body: ${{ steps.release_notes.outputs.body }}
          generate_release_notes: false
